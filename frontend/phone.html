<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f9fb" />
    <meta
      name="description"
      content="Catchy AI: clear guidance for safer conversations."
    />
    <title>Catchy AI · Your personal safety companion</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/product.css" />
    <link rel="preload" as="image" href="/assets/template-water.webp" />
    <script type="module" src="/product.js"></script>
  </head>
  <body class="is-home">
    <a class="skip" href="#content" data-t="home"></a>
    <div class="announcement">
      <span data-t="caption"></span><span data-t="secure"></span>
    </div>
    <header class="shell-header">
      <a class="wordmark" href="#home"
        ><span class="logo" aria-hidden="true"
          ><svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z" />
            <path d="M8 12l3 3 5-6" /></svg></span
        >catchy<span class="ai">AI</span></a
      >
      <nav
        id="navigation"
        aria-label="Navigation"
        data-t-aria="navigation"
      ></nav>
      <div class="header-actions">
        <select
          id="language"
          aria-label="Language"
          data-t-aria="language"
        ></select
        ><button id="account" class="round" data-t="account"></button>
      </div>
    </header>
    <section
      id="connection-status"
      class="connection-banner"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    >
      <div>
        <p id="connection-message"></p>
        <p id="connection-local-help" data-t="localConnectionHelp" hidden></p>
      </div>
      <button
        id="connection-retry"
        class="secondary"
        data-action="retryConnection"
        data-t="retryConnection"
      ></button>
    </section>
    <main id="content" tabindex="-1"></main>
    <footer>
      <span data-t="secure"></span>
      <div>
        <a href="#privacy" data-t="privacy"></a
        ><a href="#terms" data-t="terms"></a
        ><button id="install" data-t="install"></button>
      </div>
      <p class="template-credit">
        Adapted from a template by
        <a
          href="https://www.spicerdesigns.com"
          target="_blank"
          rel="noopener noreferrer"
          >Spicer Designs</a
        >
        ·
        <a
          href="https://creativecommons.org/licenses/by/4.0/"
          target="_blank"
          rel="noopener noreferrer"
          >CC BY 4.0</a
        >
      </p>
    </footer>
    <dialog id="modal"><div id="modal-body"></div></dialog>
    <dialog id="danger">
      <div class="danger-content">
        <span class="danger-icon" aria-hidden="true">!</span>
        <h1 data-t="danger"></h1>
        <p data-t="warning"></p>
        <p
          id="voice-fallback"
          role="status"
          aria-live="polite"
          hidden
          data-t="noVoice"
        ></p>
        <p id="danger-feedback" role="status" hidden></p>
        <button
          id="danger-mute"
          class="secondary"
          data-t="muteWarning"
        ></button>
        <button id="danger-stop" data-t="hangup"></button
        ><button id="danger-call" data-t="callTrusted"></button>
      </div>
    </dialog>
    <div id="notice" role="status" aria-live="polite"></div>
  </body>
</html>
